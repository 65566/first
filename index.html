        <td>${p.qty ?? '—'}</td>
        <td><button class="btn btn-ghost btn-sm" type="button" data-edit="${cons}:${idx}">تعديل</button> <button class="btn btn-danger btn-sm" type="button" data-del="${cons}:${idx}">حذف</button></td></tr>`).join('')
        : `<tr><td colspan="6"><div class="empty-state">لا توجد قطع بعد</div></td></tr>`;
    });
    panel.querySelectorAll('[data-del]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const [cons, idx] = b.dataset.del.split(':');
        state.parts[cons].splice(idx,1); draw(); toast('تم حذف القطعة'); scheduleSave();
      });
    });
    panel.querySelectorAll('[data-edit]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const [cons, idx] = b.dataset.edit.split(':');
        openPartModal(cons, Number(idx));
      });
    });
  }
  function openPartModal(cons, editIdx){
    const isEdit = editIdx!=null;
    const p = isEdit? state.parts[cons][editIdx] : null;
    openModal(`
      <h3>${isEdit? 'تعديل قطعة — ':'إضافة قطعة غيار — '}${cons==='ps5'?'فايف':'فور'}</h3>
      <div class="field" style="margin-bottom:12px;"><label>اسم القطعة</label><input id="pp_name" value="${p?p.name:''}"></div>
      <div class="form-grid" style="margin-bottom:12px;">
        <div class="field"><label>السعر القطاعي</label><input type="number" id="pp_retail" value="${p?p.retail:''}"></div>
        <div class="field"><label>السعر التجاري</label><input type="number" id="pp_commercial" value="${p?p.commercial:''}"></div>
      </div>
      <div class="field" style="margin-bottom:12px;"><label>العدد (اختياري)</label><input type="number" id="pp_qty" value="${p && p.qty!=null? p.qty : ''}"></div>
      <div class="field" style="margin-bottom:12px;"><label>نوع القطعة</label>
        <select id="pp_type">
          <option value="single" ${p && p.type==='single'?'selected':''}>قطعة واحدة</option>
          <option value="dual" ${p && p.type==='dual'?'selected':''}>قطعة مزدوجة الاستخدام (تركب في مكانين R/L)</option>
        </select>
      </div>
      <div id="pp_labels" style="${p && p.type==='dual'?'':'display:none;'}" class="form-grid">
        <div class="field"><label>مسمى الموضع الأول</label><input id="pp_labelA" value="${p&&p.labelA?p.labelA:'R'}"></div>
        <div class="field"><label>مسمى الموضع الثاني</label><input id="pp_labelB" value="${p&&p.labelB?p.labelB:'L'}"></div>
      </div>
      <div class="modal-actions"><button class="btn btn-ghost" type="button" onclick="closeModal()">إلغاء</button><button class="btn btn-primary" type="button" id="pp_save">${isEdit?'حفظ التعديلات':'إضافة'}</button></div>
    `, true);
    document.getElementById('pp_type').addEventListener('change', e=>{
      document.getElementById('pp_labels').style.display = e.target.value==='dual' ? 'grid':'none';
    });
    document.getElementById('pp_save').addEventListener('click', ()=>{
      const name = document.getElementById('pp_name').value.trim();
      if(!name){ toast('من فضلك أدخل اسم القطعة'); return; }
      const type = document.getElementById('pp_type').value;
      const qtyVal = document.getElementById('pp_qty').value;
      const payload = {
        name,
        retail:Number(document.getElementById('pp_retail').value)||0,
        commercial:Number(document.getElementById('pp_commercial').value)||0,
        qty: qtyVal? Number(qtyVal) : null,
        type,
        labelA: type==='dual'? (document.getElementById('pp_labelA').value||'R'):null,
        labelB: type==='dual'? (document.getElementById('pp_labelB').value||'L'):null
      };
      if(isEdit){ Object.assign(p, payload); toast('تم حفظ تعديلات القطعة'); }
      else { payload.id = state.partSeq++; state.parts[cons].push(payload); toast('تمت إضافة القطعة'); }
      closeModal(); draw(); scheduleSave();
    });
  }
  document.getElementById('addPartPs4').addEventListener('click', ()=>openPartModal('ps4', null));
  document.getElementById('addPartPs5').addEventListener('click', ()=>openPartModal('ps5', null));
  draw();
}

/* ---------- سجل الفواتير ---------- */
function renderInvoiceLog(panel){
  const totalCount = state.invoices.length;
  const totalRevenue = state.invoices.reduce((s,i)=>s+calcInvoiceTotal(i),0);
  const totalDue = state.invoices.reduce((s,i)=>s+(i.due||0),0);
  const pendingCount = state.invoices.filter(i=>!i.status || !i.status.startsWith('delivered')).length;
  panel.innerHTML = `
    <div class="panel-head"><div><h2>📚 سجل الفواتير</h2><div class="ph-sub">جميع فواتير الصيانة المسجلة — اضغط على أي فاتورة لعرض تفاصيلها</div></div></div>
    <div class="stat-grid">
      <div class="stat-card"><div class="st-label">عدد الفواتير</div><div class="st-value">${totalCount}</div></div>
      <div class="stat-card"><div class="st-label">إجمالي الإيرادات</div><div class="st-value">${money(totalRevenue)}</div></div>
      <div class="stat-card"><div class="st-label">مبالغ مستحقة</div><div class="st-value" style="color:var(--danger)">${money(totalDue)}</div></div>
      <div class="stat-card"><div class="st-label">فواتير قيد المعالجة</div><div class="st-value" style="color:var(--cyan)">${pendingCount}</div></div>
    </div>
    <div class="search-bar">
      <input id="logSearch" placeholder="ابحث برقم الفاتورة أو اسم العميل...">
      <input type="date" id="logDate" style="max-width:170px;">
      <select id="logStatus" style="min-width:180px">
        <option value="">كل الحالات</option>
        ${Object.entries(statusMeta).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}
      </select>
    </div>
    <div class="table-wrap"><table><thead><tr><th>الرقم</th><th>التاريخ</th><th>العميل</th><th>النوع</th><th>عدد الدراعات</th><th>الإجمالي</th><th>الحالة</th><th></th></tr></thead><tbody id="logTbody"></tbody></table></div>`;
  function draw(){
    const f = document.getElementById('logSearch').value;
    const d = document.getElementById('logDate').value;
    const s = document.getElementById('logStatus').value;
    const rows = state.invoices.filter(i=> (i.id.includes(f)||i.customer.includes(f)) && (!d || i.date===d) && (!s || i.status===s));
    document.getElementById('logTbody').innerHTML = rows.length ? rows.map(i=>`
      <tr class="row-clickable" data-details="${i.id}" style="cursor:pointer;">
      <td>${i.id}</td><td>${i.date}</td><td>${i.customer}</td><td>${i.type}</td><td>${i.controllers.length}</td><td>${money(calcInvoiceTotal(i))}</td>
      <td><span class="badge ${statusMeta[i.status]?.cls||''}">${statusMeta[i.status]?.label||i.status||'—'}</span></td>
      <td><button class="btn btn-ghost btn-sm" type="button" data-details-btn="${i.id}">تفاصيل</button></td></tr>`).join('')
      : `<tr><td colspan="8"><div class="empty-state"><div class="es-icon">📭</div>لا توجد فواتير مطابقة</div></td></tr>`;
    document.getElementById('logTbody').querySelectorAll('[data-details-btn]').forEach(b=>{
      b.addEventListener('click', (ev)=>{ ev.stopPropagation(); openInvoiceDetails(b.dataset.detailsBtn, draw); });
    });
    document.getElementById('logTbody').querySelectorAll('tr[data-details]').forEach(tr=>{
      tr.addEventListener('click', ()=> openInvoiceDetails(tr.dataset.details, draw));
    });
  }
  document.getElementById('logSearch').addEventListener('input', draw);
  document.getElementById('logDate').addEventListener('change', draw);
  document.getElementById('logStatus').addEventListener('change', draw);
  draw();
}

/* ---------- تفاصيل فاتورة: دفع / تسليم / إرسال للعميل ---------- */
function openInvoiceDetails(id, refreshCb){
  const inv = state.invoices.find(i=>i.id===id);
  if(!inv) return;
  paintDetails();
  function paintDetails(){
    const total = calcInvoiceTotal(inv);
    inv.paid = inv.paid||0; inv.due = inv.due!=null? inv.due : total; inv.discount = inv.discount||0; inv.discountPercent = inv.discountPercent||0;
    inv.controllers.forEach(c=>{ if(c.delivered===undefined) c.delivered=false; });
    const deliveredCount = inv.controllers.filter(c=>c.delivered).length;
    const totalCtrl = inv.controllers.length;
    const notYetDelivered = inv.controllers.filter(c=>!c.delivered);
    openModal(`
      <h3>تفاصيل الفاتورة ${inv.id}</h3>
      <div style="font-size:13px; color:var(--text-2); line-height:2;">
        <div><b>العميل:</b> ${inv.customer} — ${inv.phone||'بدون رقم'}</div>
        <div><b>التاريخ:</b> ${inv.date} &nbsp; <b>النوع:</b> ${inv.type}</div>
        <div><b>عدد الدراعات:</b> فايف ${inv.countPS5||0} / فور ${inv.countPS4||0}</div>
        <div><b>الحالة:</b> <span class="badge ${statusMeta[inv.status].cls}">${statusMeta[inv.status].label}</span></div>
        <div><b>الإجمالي:</b> ${money(total)} &nbsp; <b>المدفوع:</b> ${money(inv.paid)} &nbsp; <b>المتبقي:</b> ${money(inv.due)}</div>
        ${inv.discount>0? `<div><b>خصم مسجل:</b> ${money(inv.discount)} (${inv.discountPercent}%)</div>`:''}
      </div>
      <div style="border-top:1px solid var(--border); margin:14px 0; padding-top:14px;">
        <label style="display:block; font-size:12.5px; color:var(--text-2); margin-bottom:6px;">تسجيل دفعة</label>
        <div class="form-grid" style="margin-bottom:10px;">
          <div class="field"><label>المبلغ المدفوع</label><input type="number" id="pay_amount" value="${inv.paid||''}"></div>
          <div class="field"><label>نوع السداد</label>
            <select id="pay_type">
              <option value="مدفوع">مدفوع بالكامل (والباقي يُحسب خصم)</option>
              <option value="أجل">أجل (الباقي دين على العميل)</option>
              <option value="غير مدفوع">غير مدفوع</option>
            </select>
          </div>
        </div>
        <button class="btn btn-primary btn-sm" type="button" id="savePayBtn">💾 حفظ الدفع</button>
      </div>
      ${totalCtrl>0 ? `
      <div style="border-top:1px solid var(--border); margin:14px 0; padding-top:14px;">
        <label style="display:block; font-size:12.5px; color:var(--text-2); margin-bottom:6px;">تسليم دراعات — تم تسليم ${deliveredCount} من ${totalCtrl}</label>
        ${notYetDelivered.length? `
          <button class="btn btn-ghost btn-sm" type="button" id="deliverAllBtn" style="margin-bottom:10px;">📦 تسليم كل الدراعات المتبقية (${notYetDelivered.length})</button>
          <div class="checkbox-list">
            ${notYetDelivered.map(c=>`<div class="cb-item"><label><input type="checkbox" class="deliver-ctrl-cb" value="${c.uid}"> <span class="console-badge console-${c.console}">${c.console==='ps5'?'فايف':'فور'}</span> ${c.code||'—'}</label></div>`).join('')}
          </div>
          <button class="btn btn-primary btn-sm" type="button" id="deliverSelectedBtn" style="margin-top:10px;">تسليم الدراعات المحددة</button>
        ` : `<div style="font-size:12.5px; color:var(--good);">✅ كل الدراعات تم تسليمها فعليًا</div>`}
      </div>` : ''}
      <div style="border-top:1px solid var(--border); margin:14px 0; padding-top:14px;">
        <label style="display:block; font-size:12.5px; color:var(--text-2); margin-bottom:6px;">تحديث حالة الفاتورة النهائية (بعد تسليم كل الدراعات)</label>
        <div class="form-grid" style="margin-bottom:10px;">
          <div class="field full">
            <select id="deliver_status">
              <option value="delivered_paid">تم التسليم مدفوع</option>
              <option value="delivered_deferred">تم التسليم (أجل)</option>
              <option value="delivered_unpaid">تم التسليم غير مدفوع</option>
            </select>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" type="button" id="deliverBtn">📦 تأكيد الحالة النهائية</button>
      </div>
      <div class="modal-actions" style="justify-content:space-between; flex-wrap:wrap;">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn btn-ghost" type="button" id="viewInvoiceBtn">🔍 عرض الفاتورة</button>
          <button class="btn btn-ghost" type="button" id="exportPdfBtn">📄 تصدير PDF</button>
          <button class="btn btn-ghost" type="button" id="sendCustomerBtn">📲 إرسال للعميل</button>
        </div>
        <button class="btn btn-ghost" type="button" onclick="closeModal()">إغلاق</button>
      </div>
    `, true);

    document.getElementById('savePayBtn').addEventListener('click', ()=>{
      const total2 = calcInvoiceTotal(inv);
      const paidAmt = Number(document.getElementById('pay_amount').value)||0;
      const type = document.getElementById('pay_type').value;
      const remaining = Math.max(0, total2 - paidAmt);
      inv.paymentType = type;
      if(type==='أجل'){
        inv.paid = paidAmt; inv.due = remaining; inv.discount=0; inv.discountPercent=0;
        if(remaining>0) state.ledger.push({customer:inv.customer, invoiceId:inv.id, amount:remaining, type:'أجل', date:todayStr()});
      } else if(type==='مدفوع'){
        inv.paid = total2; inv.due = 0; inv.discount = remaining; inv.discountPercent = total2>0? Math.round(remaining/total2*100):0;
      } else {
        inv.paid = 0; inv.due = total2; inv.discount=0; inv.discountPercent=0;
        if(total2>0) state.ledger.push({customer:inv.customer, invoiceId:inv.id, amount:total2, type:'غير مدفوع', date:todayStr()});
      }
      toast('تم حفظ بيانات الدفع');
      scheduleSave();
      paintDetails();
      if(refreshCb) refreshCb();
    });
    document.getElementById('deliverBtn').addEventListener('click', ()=>{
      inv.status = document.getElementById('deliver_status').value;
      toast('تم تحديث حالة الفاتورة إلى: ' + statusMeta[inv.status].label);
      scheduleSave();
      paintDetails();
      if(refreshCb) refreshCb();
    });
    const deliverAllBtn = document.getElementById('deliverAllBtn');
    if(deliverAllBtn) deliverAllBtn.addEventListener('click', ()=>{
      inv.controllers.forEach(c=>{ if(!c.delivered){ c.delivered=true; c.deliveredAt=todayStr(); } });
      toast('تم تسليم كل الدراعات المتبقية');
      scheduleSave();
      paintDetails();
      if(refreshCb) refreshCb();
    });
    const deliverSelectedBtn = document.getElementById('deliverSelectedBtn');
    if(deliverSelectedBtn) deliverSelectedBtn.addEventListener('click', ()=>{
      const checked = Array.from(document.querySelectorAll('.deliver-ctrl-cb:checked')).map(cb=>cb.value);
      if(!checked.length){ toast('اختر دراع واحد على الأقل'); return; }
      checked.forEach(uid=>{
        const c = inv.controllers.find(x=>x.uid==uid);
        if(c){ c.delivered=true; c.deliveredAt=todayStr(); }
      });
      toast('تم تسليم ' + checked.length + ' دراع بنجاح');
      scheduleSave();
      paintDetails();
      if(refreshCb) refreshCb();
    });
    document.getElementById('viewInvoiceBtn').addEventListener('click', ()=> openInvoiceViewModal(inv));
    document.getElementById('exportPdfBtn').addEventListener('click', ()=> exportInvoicePDF(inv));
    document.getElementById('sendCustomerBtn').addEventListener('click', ()=>{
      const data = {customer:inv.customer, code:inv.id, date:inv.date, type:inv.type, phone:inv.phone||'—', controllers:inv.controllers.length, total: money(calcInvoiceTotal(inv)), shopPhone:state.settings.shopPhone};
      const msg = applyTemplate(state.settings.templates.invoice, data);
      sendWhatsApp(inv.phone, msg);
    });
  }
}

/* ---------- الفواتير المعلقة ---------- */
function renderPending(panel){
  const notDone = [];
  const doneNotDelivered = [];
  state.invoices.forEach(inv=>{
    if(inv.status.startsWith('delivered')) return;
    const missingPS5 = Math.max(0, (inv.countPS5||0) - inv.controllers.filter(c=>c.console==='ps5').length);
    const missingPS4 = Math.max(0, (inv.countPS4||0) - inv.controllers.filter(c=>c.console==='ps4').length);
    for(let i=0;i<missingPS5;i++) notDone.push({inv, c:{console:'ps5', code:null, items:[]}, virtual:true});
    for(let i=0;i<missingPS4;i++) notDone.push({inv, c:{console:'ps4', code:null, items:[]}, virtual:true});
    inv.controllers.forEach(c=>{
      if(c.delivered) return;
      if(c.items.length===0) notDone.push({inv,c,virtual:false});
      else doneNotDelivered.push({inv,c});
    });
  });
  panel.innerHTML = `
    <div class="panel-head"><div><h2>⏳ الفواتير المعلقة</h2><div class="ph-sub">كل الدراعات التي لم تُصلح بعد (حتى لو لسه ما اتسجلتش بكود)، والدراعات التي أُصلحت ولم تُسلَّم بعد</div></div></div>
    <h3 style="margin:6px 0 12px; font-size:15px;">🔧 دراعات لم تُصلح بعد (${notDone.length})</h3>
    <div class="table-wrap"><table><thead><tr><th>الفاتورة</th><th>العميل</th><th>الهاتف</th><th>نوع الدراع</th><th>كود الدراع</th><th>الحالة</th></tr></thead><tbody>
      ${notDone.length? notDone.map(r=>`
        <tr><td>${r.inv.id}</td><td>${r.inv.customer}</td><td>${r.inv.phone||'—'}</td><td><span class="console-badge console-${r.c.console}">${r.c.console==='ps5'?'فايف':'فور'}</span></td><td>${r.c.code||'—'}</td><td><span class="badge badge-wait">${r.virtual? 'لم يُسجل بعد':'بانتظار الإصلاح'}</span></td></tr>`).join('')
      : '<tr><td colspan="6"><div class="empty-state"><div class="es-icon">✅</div>لا يوجد دراعات بانتظار الإصلاح</div></td></tr>'}
    </tbody></table></div>

    <h3 style="margin:26px 0 12px; font-size:15px;">📦 دراعات تم إصلاحها ولم تُسلَّم بعد (${doneNotDelivered.length})</h3>
    <div class="table-wrap"><table><thead><tr><th>الفاتورة</th><th>العميل</th><th>الهاتف</th><th>نوع الدراع</th><th>كود الدراع</th><th>إجمالي الدراع</th><th>الحالة</th></tr></thead><tbody>
      ${doneNotDelivered.length? doneNotDelivered.map(r=>`
        <tr><td>${r.inv.id}</td><td>${r.inv.customer}</td><td>${r.inv.phone||'—'}</td><td><span class="console-badge console-${r.c.console}">${r.c.console==='ps5'?'فايف':'فور'}</span></td><td>${r.c.code||'—'}</td><td>${money(calcControllerSubtotal(r.c))}</td><td><span class="badge badge-ready">جاهز للتسليم</span></td></tr>`).join('')
      : '<tr><td colspan="7"><div class="empty-state"><div class="es-icon">✅</div>لا يوجد دراعات جاهزة بانتظار التسليم</div></td></tr>'}
    </tbody></table></div>`;
}

/* ---------- التقارير (تجاري مقابل قطاعي) ---------- */
function renderReports(panel){
  function recomputeInvoice(inv, forceType){
    let sum = 0;
    inv.controllers.forEach(c=>{
      c.items.forEach(it=>{
        if(it.kind==='service'){ sum += it.price; return; }
        const list = state.parts[c.console] || [];
        const part = list.find(p=>p.name===it.name);
        sum += part ? (forceType==='تجاري'? part.commercial : part.retail) : it.price;
      });
    });
    return sum;
  }
  const reportA = state.invoices.reduce((s,i)=> s + recomputeInvoice(i,'تجاري'), 0);
  const retailInvoices = state.invoices.filter(i=>i.type==='قطاعي');
  const reportB = retailInvoices.reduce((s,i)=> s + recomputeInvoice(i,'قطاعي'), 0);
  const diff = reportA - reportB;
  panel.innerHTML = `
    <div class="panel-head"><div><h2>📈 التقارير</h2><div class="ph-sub">مقارنة الإيراد كلو كتسعير تجاري، مقابل الفواتير القطاعية الأصلية فقط</div></div></div>
    <div class="stat-grid stat-grid-3">
      <div class="stat-card"><div class="st-label">كل الفواتير باعتبارها تجاري</div><div class="st-value">${money(reportA)}</div><div class="st-trend">${state.invoices.length} فاتورة</div></div>
      <div class="stat-card"><div class="st-label">الفواتير القطاعية الأصلية فقط</div><div class="st-value">${money(reportB)}</div><div class="st-trend">${retailInvoices.length} فاتورة</div></div>
      <div class="stat-card"><div class="st-label">الفرق بين التقريرين</div><div class="st-value" style="color:var(--cyan)">${money(diff)}</div><div class="st-trend">تأثير التسعير التجاري</div></div>
    </div>
    <div class="empty-state" style="padding:20px; text-align:right; color:var(--text-3); font-size:12.5px;">التقرير الأول يعيد حساب كل الفواتير (بكل أنواعها) بافتراض أنها كلها تجاري. التقرير الثاني يحسب فقط الفواتير التي كانت أصلاً قطاعي بسعرها القطاعي. الفرق بينهما يوضح أثر التسعير التجاري على الإيراد.</div>`;
}

    document.getElementById('usersTbody').innerHTML = state.users.map((u,idx)=>`
      <tr><td>${u.name}</td><td>${u.username}</td><td>${u.role}</td>

      <td>${idx===0? '' : `<button class="btn btn-ghost btn-sm" type="button" data-edit="${idx}">تعديل</button> <button class="btn btn-danger btn-sm" type="button" data-del="${idx}">إزالة</button>`}</td></tr>`).join('');
    document.getElementById('usersTbody').querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
      state.users.splice(b.dataset.del,1); draw(); toast('تم إزالة المستخدم'); scheduleSave(); populateLoginUserSelect();
    }));
    document.getElementById('usersTbody').querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=> openUserModal(Number(b.dataset.edit))));
  }

  function openUserModal(editIdx){
    const isEdit = editIdx!=null;
    const u = isEdit? state.users[editIdx] : null;
    openModal(`<h3>${isEdit? 'تعديل مستخدم: '+u.name : 'إضافة مستخدم جديد'}</h3>
      <div class="field" style="margin-bottom:12px"><label>الاسم</label><input id="nu_name" value="${u?u.name:''}"></div>
      <div class="form-grid" style="margin-bottom:12px;">
        <div class="field"><label>اسم الدخول (يوزر)</label><input id="nu_username" value="${u?u.username:''}"></div>
        <div class="field"><label>كلمة المرور</label><input id="nu_password" type="text" value="${u?u.password:''}"></div>
      </div>
      <div class="field" style="margin-bottom:12px"><label>الدور الوظيفي</label><input id="nu_role" value="${u?u.role:''}" placeholder="مثال: فني صيانة دراعات"></div>
      <div class="field" style="margin-bottom:12px"><label>الصلاحية</label>
        <select id="nu_admin">
          <option value="0" ${u && !u.admin?'selected':''}>موظف (صلاحيات محددة)</option>
          <option value="1" ${u && u.admin?'selected':''}>مدير (كل الصلاحيات)</option>
        </select>
      </div>
      <div class="field" id="nu_permsWrap" style="${u && u.admin?'display:none;':''}">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <label style="margin:0;">الصفحات المسموح بالدخول عليها</label>
          <button type="button" class="btn btn-ghost btn-sm" id="nu_selectAll" style="padding:4px 10px;">تحديد الكل</button>
        </div>
        <div class="checkbox-list">
          ${allModules.map(m=>`<div class="cb-item"><label><input type="checkbox" value="${m.id}" class="nu-perm" ${u && (u.permissions||[]).includes(m.id)?'checked':''}> ${m.label}</label></div>`).join('')}
        </div>
      </div>
      <div class="modal-actions"><button class="btn btn-ghost" type="button" onclick="closeModal()">إلغاء</button><button class="btn btn-primary" type="button" id="nu_save">${isEdit?'حفظ التعديلات':'إضافة'}</button></div>`, true);
    document.getElementById('nu_admin').addEventListener('change', e=>{
      document.getElementById('nu_permsWrap').style.display = e.target.value==='1' ? 'none':'block';
    });
    document.getElementById('nu_selectAll').addEventListener('click', ()=>{
      const boxes = document.querySelectorAll('.nu-perm');
      const allChecked = Array.from(boxes).every(cb=>cb.checked);
      boxes.forEach(cb=> cb.checked = !allChecked);
    });
    document.getElementById('nu_save').addEventListener('click', ()=>{
      const name = document.getElementById('nu_name').value.trim();
      const username = document.getElementById('nu_username').value.trim();
      const password = document.getElementById('nu_password').value.trim();
      if(!name || !username || !password){ toast('من فضلك أكمل الاسم واليوزر وكلمة المرور'); return; }
      const dup = state.users.find((usr,i)=> usr.username===username && i!==editIdx);
      if(dup){ toast('اسم الدخول ده مستخدم بالفعل'); return; }
      const isAdmin = document.getElementById('nu_admin').value==='1';
      const perms = Array.from(document.querySelectorAll('.nu-perm:checked')).map(cb=>cb.value);
      const payload = {name, username, password, role:document.getElementById('nu_role').value||'موظف', admin:isAdmin, permissions:perms};
      if(isEdit){ Object.assign(state.users[editIdx], payload); toast('تم حفظ تعديلات المستخدم'); }
      else { state.users.push(payload); toast('تمت إضافة المستخدم'); }
      closeModal(); draw(); scheduleSave(); populateLoginUserSelect();
    });
  }
  document.getElementById('addUser').addEventListener('click', ()=> openUserModal(null));
  draw();
}

    <div class="table-wrap"><table><thead><tr><th>الرقم</th><th>الصنف</th><th>الكمية</th><th>الإجمالي</th><th>التاريخ</th></tr></thead><tbody id="saleTbody"></tbody></table></div>`;
  let saleType='قطاعي';
  panel.querySelectorAll('.seg-toggle button').forEach(b=>{
    b.addEventListener('click', ()=>{
      saleType=b.dataset.type;
      panel.querySelectorAll('.seg-toggle button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      fillItems();
    });
  });
  function fillItems(){
    const cons = document.getElementById('s_console').value;
    const sel = document.getElementById('s_item');
    sel.innerHTML = state.parts[cons].map(p=>`<option value="${p.id}" data-price="${saleType==='تجاري'?p.commercial:p.retail}">${p.name} — ${money(saleType==='تجاري'?p.commercial:p.retail)}</option>`).join('') || '<option disabled>لا توجد قطع متاحة</option>';
    updateTotal();
  }
  document.getElementById('s_console').addEventListener('change', fillItems);
  function updateTotal(){
    const sel = document.getElementById('s_item');
    if(!sel.selectedOptions[0] || !sel.selectedOptions[0].dataset.price){ document.getElementById('s_total').value=''; return; }
    const price = Number(sel.selectedOptions[0].dataset.price);
    const qty = Number(document.getElementById('s_qty').value)||0;
    document.getElementById('s_total').value = money(price*qty);
  }
  document.getElementById('s_item').addEventListener('change', updateTotal);
  document.getElementById('s_qty').addEventListener('input', updateTotal);
  function drawSales(){
    document.getElementById('saleTbody').innerHTML = state.sales.map(s=>`
      <tr><td>${s.id}</td><td>${s.item}</td><td>${s.qty}</td><td>${money(s.price*s.qty)}</td><td>${s.date}</td></tr>`).join('');
  }
  document.getElementById('saleSaveBtn').addEventListener('click', ()=>{
    const cons = document.getElementById('s_console').value;
    const sel = document.getElementById('s_item');
    const part = state.parts[cons].find(p=>p.id==sel.value);
    if(!part){ toast('لا توجد قطعة محددة'); return; }
    const price = saleType==='تجاري'?part.commercial:part.retail;
    const qty = Number(document.getElementById('s_qty').value)||1;
    if(part.qty!=null) part.qty = Math.max(0, part.qty-qty);
    const id = 'SAL-' + (state.seq.sale++);
    state.sales.unshift({id, item:part.name, qty, price, customer:document.getElementById('s_customer').value||'زائر', date:new Date().toISOString().slice(0,10)});
    toast('تم إصدار فاتورة البيع ' + id);
    scheduleSave();
    document.getElementById('s_customer').value='';
    document.getElementById('s_qty').value=1;
    drawSales();
  });
  fillItems();
  drawSales();
}

/* ============ Circuit background animation ============ */
(function(){
  const canvas = document.getElementById('circuitCanvas');
  const ctx = canvas.getContext('2d');
  let w,h, nodes=[];
  function resize(){ w=canvas.width=innerWidth; h=canvas.height=innerHeight; }
  resize(); addEventListener('resize', resize);
  const N = 46;
  for(let i=0;i<N;i++){
    nodes.push({x:Math.random()*w, y:Math.random()*h, vx:(Math.random()-.5)*.25, vy:(Math.random()-.5)*.25});
  }
  function tick(){
    ctx.clearRect(0,0,w,h);
    const isLight = document.documentElement.getAttribute('data-theme')==='light';
    ctx.strokeStyle = isLight? 'rgba(46,99,201,0.12)' : 'rgba(51,224,255,0.14)';
    ctx.fillStyle = isLight? 'rgba(46,99,201,0.35)' : 'rgba(51,224,255,0.5)';
    for(const n of nodes){
      n.x+=n.vx; n.y+=n.vy;
      if(n.x<0||n.x>w) n.vx*=-1;
      if(n.y<0||n.y>h) n.vy*=-1;
    }
    for(let i=0;i<N;i++){
      for(let j=i+1;j<N;j++){
        const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y;
        const d = Math.hypot(dx,dy);
        if(d<140){
          ctx.globalAlpha = 1-d/140;
          ctx.beginPath(); ctx.moveTo(nodes[i].x,nodes[i].y); ctx.lineTo(nodes[j].x,nodes[j].y); ctx.stroke();
        }
      }
    }
    ctx.globalAlpha=1;
    for(const n of nodes){ ctx.beginPath(); ctx.arc(n.x,n.y,1.6,0,7); ctx.fill(); }
    requestAnimationFrame(tick);
  }
  tick();
})();

/* ============ INIT ============ */
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise(resolve=> setTimeout(()=>resolve(false), ms))
  ]);
}
populateLoginUserSelect();
setTimeout(()=>{
  const el = document.getElementById('splash');
  if(el){ el.style.opacity='0'; el.style.visibility='hidden'; }
}, 1200);
(async function init(){
  if(!cloudEnabled) return;
  try{
    const ok = await withTimeout(ensureAuth(), 7000);
    if(ok){
      await withTimeout(loadFromCloud(), 7000);
      populateLoginUserSelect();
      autoDailySnapshot();
    } else {
      cloudEnabled = false;
      setSyncStatus('off','محلي فقط (تعذر الاتصال)');
    }
  }catch(e){
    console.error(e);
    cloudEnabled = false;
    setSyncStatus('off','محلي فقط (خطأ اتصال)');
  }
})();
applyTheme('dark');
